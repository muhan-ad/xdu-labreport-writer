name: Release
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { 'exists=true' >> $env:GITHUB_OUTPUT } else { 'exists=false' >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci
      - name: Build bundled Python runtime
        if: steps.version.outputs.exists == 'false'
        run: python scripts/build-python-runtime.py --mirror python.org
      - name: Verify bundled application
        if: steps.version.outputs.exists == 'false'
        run: npm run verify
      - name: Build Windows installer
        if: steps.version.outputs.exists == 'false'
        run: npm run build:win -- --publish never
      - name: Publish release and installer
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $installer = "dist/实验搭子 Setup $version.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw 'Installer missing' }
          $asset = "dist/labreport-setup-$version.exe"
          Copy-Item -LiteralPath $installer -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  labreport-setup-$version.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
          gh release create "v$version" $asset dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target "$(git rev-parse HEAD)" --title "实验搭子 v$version" --notes-file "docs/releases/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
