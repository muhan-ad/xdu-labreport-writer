<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>报告预览</title>
    <style>
      html,
      body {
        margin: 0;
        background: #edf0e9;
        color: #111;
      }
      #report {
        padding: 12px 0;
      }
      .docx-wrapper {
        padding: 0 !important;
        background: none !important;
      }
      .docx-wrapper > section.docx {
        box-shadow: none !important;
        padding: 24px !important;
        margin: 0 0 12px !important;
        width: 100% !important;
        min-height: 0 !important;
        box-sizing: border-box;
        overflow-wrap: anywhere;
      }
      article {
        max-width: 100% !important;
      }
      img,
      svg {
        max-width: 100%;
      }
      table {
        max-width: 100%;
      }
      p {
        overflow-wrap: anywhere;
      }
      a {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="report"></main>
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
